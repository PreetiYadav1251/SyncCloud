services:

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: synccloud-backend
    env_file:
      - ./Backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: synccloud-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped